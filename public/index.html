<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>HAE LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: fixed left rail of modules + scrolling work area; rail becomes a top tab strip on phones */
:root{
  --bg:#f6f5fa; --panel:#ffffff; --rail:#16121f; --rail-fg:#c8c2d8; --rail-active:#ffffff;
  --fg:#1b1726; --muted:#625c72; --line:#e5e2ed; --soft:#f0eef6;
  --accent:#7a3ff0; --accent-fg:#ffffff; --accent-soft:#efe8ff; --brand:#8c54fc;
  --new:#2f63d4; --new-bg:#e6edfd; --open:#6a4bc4; --open-bg:#efe9fc;
  --follow:#a35b00; --follow-bg:#fdf0dc; --won:#177245; --won-bg:#e1f3e8;
  --dead:#8a3434; --dead-bg:#f8e5e5; --warn:#a35b00;
  --shadow:0 1px 2px rgba(22,18,31,.06),0 8px 24px rgba(22,18,31,.08);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110e18; --panel:#1a1624; --rail:#0b0910; --rail-fg:#a49cb8; --rail-active:#ffffff;
  --fg:#ebe8f2; --muted:#9e97b0; --line:#2c263a; --soft:#221d2e;
  --accent:#a586ff; --accent-fg:#140c26; --accent-soft:#2a2142; --brand:#9a68ff;
  --new:#94a9ff; --new-bg:#1f2847; --open:#b8a2f5; --open-bg:#2a2244; --follow:#f0b45c; --follow-bg:#3a2b14;
  --won:#6fd39a; --won-bg:#15301f; --dead:#f09a9a; --dead-bg:#3a1c1c; --warn:#f0b45c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110e18; --panel:#1a1624; --rail:#0b0910; --rail-fg:#a49cb8; --rail-active:#ffffff;
  --fg:#ebe8f2; --muted:#9e97b0; --line:#2c263a; --soft:#221d2e;
  --accent:#a586ff; --accent-fg:#140c26; --accent-soft:#2a2142; --brand:#9a68ff;
  --new:#94a9ff; --new-bg:#1f2847; --open:#b8a2f5; --open-bg:#2a2244; --follow:#f0b45c; --follow-bg:#3a2b14;
  --won:#6fd39a; --won-bg:#15301f; --dead:#f09a9a; --dead-bg:#3a1c1c; --warn:#f0b45c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-fg);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--rail-active);padding:4px 10px 18px;letter-spacing:-.01em}
.brand img{display:block;height:38px;width:auto;margin-bottom:6px}
.auth-side .brand img{height:56px}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-fg);opacity:.8;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:6px;display:flex;align-items:center;gap:10px;font-weight:500;color:var(--rail-fg);white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.06);color:var(--rail-active)}
.nav button.on{background:rgba(140,84,252,.24);color:var(--rail-active);box-shadow:inset 3px 0 0 var(--brand)}
.nav button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.nav .ct{margin-left:auto;font-family:var(--f-mono);font-size:11px;opacity:.7}
.rail-foot{margin-top:auto;padding:12px 10px 0;font-size:12px;opacity:.75}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top h1{font-family:var(--f-display);font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.top .sp{flex:1}
.search{position:relative;min-width:0;flex:0 1 300px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.sres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);max-height:340px;overflow:auto;z-index:20}
.sres button{all:unset;display:block;width:100%;box-sizing:border-box;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.sres button:hover,.sres button:focus-visible{background:var(--soft)}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.who select{padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);max-width:220px}
.bell{position:relative}
.bell .dot{position:absolute;top:-4px;right:-4px;background:var(--dead);color:#fff;font-size:10px;font-family:var(--f-mono);border-radius:9px;padding:1px 5px}
.content{padding-block:20px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--dead)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chipbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);min-width:0}
.bar input[type=search]{flex:1 1 200px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel>h2,.ph{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.ph .sp{flex:1}
.pb{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi:hover{border-color:var(--accent)}
.kpi:focus-visible{outline:2px solid var(--accent)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.k-new .v{color:var(--new)} .kpi.k-fu .v{color:var(--follow)} .kpi.k-won .v{color:var(--won)} .kpi.k-dead .v{color:var(--dead)}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
td.num,th.num{text-align:right}
.mono{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sub{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-new{color:var(--new);background:var(--new-bg)} .c-open{color:var(--open);background:var(--open-bg)}
.c-followup{color:var(--follow);background:var(--follow-bg)} .c-converted{color:var(--won);background:var(--won-bg)}
.c-dead{color:var(--dead);background:var(--dead-bg)} .c-off{color:var(--muted);background:var(--soft)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;background:var(--soft);font-size:12px;margin:1px 2px 1px 0;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:13px}
.track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--brand);border-radius:5px}
.notes{display:flex;flex-direction:column}
.note{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.note:last-child{border-bottom:0}
.note .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:2px 6px;border-radius:4px;flex:none;margin-top:2px}
.k-newlead{background:var(--new-bg);color:var(--new)} .k-reminder{background:var(--follow-bg);color:var(--follow)}
.k-admin{background:var(--dead-bg);color:var(--dead)} .k-manager{background:var(--open-bg);color:var(--open)} .k-tl{background:var(--won-bg);color:var(--won)}
.note.unread .t{font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.tree{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line)}
.tree.root{padding-left:0;border:0}
.tree li{padding:5px 0}
.tnode{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--follow-bg);color:var(--fg);display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left;white-space:nowrap}
.matrix input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,13,20,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.md{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);width:min(720px,100%);border:1px solid var(--line)}
.md.wide{width:min(960px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mh h3{font-family:var(--f-display);font-size:18px;margin:0;flex:1;min-width:0}
.mb{padding:18px;display:flex;flex-direction:column;gap:16px}
.mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:2px 8px;border-radius:6px;color:var(--muted)}
.x:hover{background:var(--soft)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);width:100%}
.f textarea{min-height:90px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.hint.warn{color:var(--warn)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:400;color:var(--fg)}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px}
.dl div{min-width:0}
.dl dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.dl dd{margin:2px 0 0;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.tl li{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.tl li:last-child{border:0}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.box h4{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.preview{white-space:pre-wrap;background:var(--soft);border-radius:var(--r);padding:12px;font-size:13px;max-height:280px;overflow:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.card h4{margin:0;font-size:15px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:max(20px,env(safe-area-inset-right,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);z-index:80;box-shadow:var(--shadow);max-width:min(380px,calc(100vw - 40px))}
.swatch{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:middle}
/* upload + remarks */
.rmk{max-width:280px;min-width:160px}
.rmk .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
.rmk .m{font-size:11px;color:var(--muted);margin-top:2px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--soft)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input[type=file]{max-width:100%}
.mapgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.mapgrid .f select{padding:6px 8px}
.mapgrid .f label .req{color:var(--dead)}
.stats3{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 120px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat.ok b{color:var(--won)} .stat.bad b{color:var(--dead)} .stat.skip b{color:var(--follow)}
.errlist{max-height:180px;overflow:auto;font-size:12px;border:1px solid var(--line);border-radius:8px}
.errlist div{padding:6px 10px;border-bottom:1px solid var(--line)} .errlist div:last-child{border:0}
.labels{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:760px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
/* saas */
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.plan{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.plan.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.plan h3{margin:0;font-family:var(--f-display);font-size:18px}
.plan .price{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.plan .price small{font-size:13px;color:var(--muted);font-weight:500;font-family:var(--f-body)}
.plan ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}
.plan .btn{margin-top:auto}
.meterrow{display:grid;grid-template-columns:150px 1fr 120px;gap:12px;align-items:center;font-size:13px}
.meterrow .track{height:8px}
.codebox{font-family:var(--f-mono);font-size:18px;letter-spacing:.06em;padding:8px 12px;border:1px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft);color:var(--accent);user-select:all}
.seg.sm{max-width:100%}
@media (max-width:900px){.plans{grid-template-columns:minmax(0,1fr)}.meterrow{grid-template-columns:110px 1fr 90px}}
/* auth */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);background:var(--bg)}
.auth-side{background:var(--rail);color:var(--rail-fg);padding:48px max(40px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px;justify-content:space-between}
.auth-side .brand{padding:0;font-size:28px}
.auth-side h2 em{font-style:normal;color:var(--brand)}
.auth-side h2{font-family:var(--f-display);color:var(--rail-active);font-size:clamp(26px,3.2vw,40px);line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance;max-width:16ch}
.auth-side p{margin:0;max-width:44ch;line-height:1.55}
.pipe{display:flex;flex-direction:column;gap:8px;max-width:340px}
.pipe div{display:flex;align-items:center;gap:10px;font-size:13px}
.pipe .bar2{height:8px;border-radius:4px;background:var(--brand)}
.pipe span.n{font-family:var(--f-mono);font-size:11px;color:var(--rail-active);width:28px;text-align:right}
.pipe span.t{width:84px}
.auth-main{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.acard{width:min(420px,100%);display:flex;flex-direction:column;gap:20px}
.acard h1{font-family:var(--f-display);font-size:28px;margin:0;letter-spacing:-.01em}
.acard .lead{color:var(--muted);margin:-12px 0 0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:var(--r);padding:4px;gap:4px}
.seg button{all:unset;text-align:center;padding:8px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.aform{display:flex;flex-direction:column;gap:14px}
.aform .f input{padding:10px 12px;font-size:15px}
.pw{position:relative}.pw input{padding-right:64px!important}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:6px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.arow label{display:flex;gap:6px;align-items:center}
.link{all:unset;color:var(--accent);cursor:pointer;font-weight:600}
.link:focus-visible{outline:2px solid var(--accent)}
.amsg{padding:10px 12px;border-radius:var(--r);font-size:13px}
.amsg.err{background:var(--dead-bg);color:var(--dead)}
.amsg.ok{background:var(--won-bg);color:var(--won)}
.amsg.info{background:var(--soft);color:var(--fg)}
.abtn{padding:11px;font-size:15px;width:100%}
.meter{height:4px;border-radius:2px;background:var(--soft);overflow:hidden}.meter i{display:block;height:100%;width:0;transition:width .2s}
.demo{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:18px}
.demo h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dcred{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.dcred:hover{border-color:var(--accent);background:var(--accent-soft)}
.dcred:focus-visible{outline:2px solid var(--accent)}
.dcred b{font-size:13px}
.dcred span{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:420px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.small{font-size:12px;color:var(--muted);line-height:1.5}
.uchip{display:flex;align-items:center;gap:8px;font-size:13px}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
@media (max-width:860px){.auth{grid-template-columns:minmax(0,1fr)}.auth-side{padding:28px max(16px,env(safe-area-inset-left,0px)) 28px max(16px,env(safe-area-inset-right,0px));gap:14px}.auth-side .pipe,.auth-side .foot{display:none}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));overflow-x:auto;gap:6px}
  .brand{padding:0 10px 0 0;font-size:17px}.brand img{height:24px;margin:0}.brand small,.rail-foot{display:none}
  .nav{flex-direction:row}
  .top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .search{flex:1 1 100%;order:5}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form,.dl{grid-template-columns:minmax(0,1fr)}
  .tl li{grid-template-columns:minmax(0,1fr)}
  .brow{grid-template-columns:90px 1fr 30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ---------- constants ---------- */
const COLS=["roles","staff","statuses","sources","projects","products","leads","customers","templates","alerts"];
const PERMS=[
 ["createLead","Create lead"],["uploadLeads","Upload lead sheet"],["assignLead","Assign lead"],["assignProduct","Assign product"],["updateLead","Update lead"],
 ["reassignLead","Reassign lead"],["viewLead","View leads"],["assignStatus","Assign status"],["oldProjects","View customer's old projects"],
 ["dashboard","Dashboard access"],["sendAlert","Send alerts"],["manageStaff","Manage staff"],["manageMasters","Manage masters & templates"]];
const SCOPES={all:"All leads",hierarchy:"Own hierarchy",team:"Own team",routed:"Leads they created or own",own:"Own leads only",converted:"Converted leads + own"};
const CATS={new:"New",open:"Open",followup:"Follow-up",converted:"Converted",dead:"Dead"};
const CHANNELS={email:"Email",sms:"SMS",whatsapp:"WhatsApp"};
const TTYPES=["Proposal","Quotation","Requirement","Follow-up","General"];
const MERGE=["{name}","{company}","{product}","{mobile}","{email}","{lead_id}","{customer_id}","{staff}","{staff_mobile}"];

/* ---------- state ---------- */
const S={}; COLS.forEach(c=>S[c]=[]);
const loaded=new Set();
let ORG=null, PLATFORM=false, PLAT={rows:null,busy:false}, signupMode="company";
let view="dashboard", authReady=false, authStaffId=null, previewId=null, authMode="login", authMsg=null, authBusy=false, demoAccounts=[];
const ui={leadQ:"",fStatus:"",fSource:"",fProduct:"",fStaff:"",fKpi:"",staffTab:"active",mastersTab:"statuses",custQ:"",alertsTab:"inbox"};
try{const v=localStorage.getItem("ld_view"); if(v) view=v;}catch(e){}
if(location.hash&&location.hash.length>1){view=location.hash.slice(1)}

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const mkCode=p=>p+"-"+(Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,4)).toUpperCase();
const byId=(c,id)=>S[c].find(x=>x.id===id);
const nm=(c,id,f="name")=>{const x=byId(c,id);return x?x[f]:""};
const todayStr=()=>new Date().toLocaleDateString("en-CA");
const dayOf=ms=>new Date(ms).toLocaleDateString("en-CA");
const fmt=ms=>ms?new Date(ms).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"";
const fmtD=ms=>ms?new Date(ms).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"";
const fuMs=l=>l.followUpAt?new Date(l.followUpAt).getTime():null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

/* ---------- API ---------- */
async function api(method,url,body){
  let r; try{r=await fetch(url,{method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined})}
  catch(e){toast("Can't reach the server. Check your connection.");throw e}
  let data={}; try{data=await r.json()}catch(e){}
  if(r.status===401&&!url.startsWith("/api/auth/")){const was=signedIn();authStaffId=null;previewId=null;authMsg=was?{t:"info",m:data.error||"Please log in again."}:null;closeModal();render();throw new Error("auth")}
  if(!r.ok){const err=new Error(data.error||"Something went wrong.");err.status=r.status;err.shown=true;toast(err.message);throw err}
  return data}
/* call an API, then reload data; returns false (and has shown the error) on failure */
async function act(method,url,body){try{const d=await api(method,url,body);await refresh();return d||true}catch(e){return false}}
async function save(col,obj){const{id,...rest}=obj;return act("PUT",`/api/${col}/${encodeURIComponent(id)}`,rest)}
async function remove(col,id){return act("DELETE",`/api/${col}/${encodeURIComponent(id)}`)}
async function refresh(){
  const d=await api("GET","/api/bootstrap"+(previewId?`?as=${encodeURIComponent(previewId)}`:""));
  COLS.forEach(c=>S[c]=d[c]||[]); ORG=d.org; PLATFORM=!!d.platformAdmin; authStaffId=d.realMe; render()}

/* ---------- identity & permissions ---------- */
const realMe=()=>authStaffId?byId("staff",authStaffId):null;
const realIsSuper=()=>roleOf(realMe())?.level==="superadmin";
function me(){const r=realMe(); if(previewId&&realIsSuper()){const p=byId("staff",previewId); if(p) return p} return r}
const roleOf=s=>s?byId("roles",s.roleId):null;
const isSuper=()=>roleOf(me())?.level==="superadmin";
function can(p){const r=roleOf(me()); if(!r) return !S.staff.length; return r.level==="superadmin"||!!(r.perms&&r.perms[p])}
const scopeOf=()=>{const r=roleOf(me());return r?(r.level==="superadmin"?"all":r.scope||"own"):"all"};
function descendants(id){const out=[],q=[id];while(q.length){const c=q.shift();S.staff.forEach(s=>{if(s.reportsTo===c&&!out.includes(s.id)&&s.id!==id){out.push(s.id);q.push(s.id)}})}return out}
const directs=id=>S.staff.filter(s=>s.reportsTo===id).map(s=>s.id);
function reach(){const all=S.staff.filter(s=>!s.pending&&!s.rejected).map(s=>s.id); const m=me(); if(!m) return all; const sc=scopeOf(); if(sc==="all") return all; return [m.id,...descendants(m.id)]}
const catOf=l=>byId("statuses",l.statusId)?.cat||"new";
const closed=l=>["converted","dead"].includes(catOf(l));
function visibleLeads(){
  const m=me(); if(!m) return S.leads; const sc=scopeOf();
  if(sc==="all") return S.leads;
  if(sc==="hierarchy"){const ids=[m.id,...descendants(m.id)];return S.leads.filter(l=>ids.includes(l.assignedTo))}
  if(sc==="team"){const ids=[m.id,...directs(m.id)];return S.leads.filter(l=>ids.includes(l.assignedTo))}
  if(sc==="routed") return S.leads.filter(l=>l.assignedTo===m.id||l.createdBy===m.id);
  if(sc==="converted") return S.leads.filter(l=>l.assignedTo===m.id||catOf(l)==="converted");
  return S.leads.filter(l=>l.assignedTo===m.id);
}
function onShift(s){
  if(!s.onTime||!s.offTime) return true;
  const n=new Date(), cur=n.getHours()*60+n.getMinutes();
  const t=v=>{const[a,b]=v.split(":").map(Number);return a*60+b}; const on=t(s.onTime),off=t(s.offTime);
  return on<=off?cur>=on&&cur<off:cur>=on||cur<off;
}
function autoAssign(productId){
  const open=id=>S.leads.filter(l=>l.assignedTo===id&&!closed(l)).length;
  const pool=S.staff.filter(s=>s.active!==false&&["telecaller","coordinator"].includes(roleOf(s)?.level)&&(!s.products?.length||s.products.includes(productId)));
  const shift=pool.filter(onShift); const use=shift.length?shift:pool;
  use.sort((a,b)=>open(a.id)-open(b.id)); return use[0]?.id||"";
}
const statusesFor=pid=>S.statuses.filter(s=>s.active!==false&&(!s.products?.length||s.products.includes(pid))).sort((a,b)=>(a.order??99)-(b.order??99));
const defaultStatus=pid=>(statusesFor(pid).find(s=>s.cat==="new")||statusesFor(pid)[0])?.id||"";

/* ---------- notifications ---------- */
function myAlerts(){const m=me(); if(!m) return []; return S.alerts.filter(a=>(a.to||[]).includes(m.id)).sort((a,b)=>b.at-a.at)}
function myReminders(){const m=me(); if(!m) return []; const end=new Date();end.setHours(23,59,59,999);
  return S.leads.filter(l=>l.assignedTo===m.id&&!closed(l)&&fuMs(l)&&fuMs(l)<=end.getTime()).sort((a,b)=>fuMs(a)-fuMs(b))}
const unreadCount=()=>{const m=me();return m?myAlerts().filter(a=>!(a.readBy||[]).includes(m.id)).length+myReminders().length:0};

/* ---------- navigation ---------- */
const NAV=[["dashboard","Dashboard",()=>true],["leads","Leads",()=>can("viewLead")],["customers","Customers",()=>can("viewLead")],
 ["staff","Staff",()=>can("manageStaff")],["roles","Roles & Rules",()=>can("manageStaff")],["masters","Status, Source & Product",()=>can("manageMasters")],
 ["templates","Templates",()=>can("manageMasters")],["alerts","Alerts",()=>true],
 ["billing","Company & Billing",()=>realIsSuper()&&!previewId],["platform","Platform",()=>PLATFORM&&!previewId]];
function go(v){view=v;try{localStorage.setItem("ld_view",v)}catch(e){}closeSearch();render();window.scrollTo(0,0)}

/* ---------- render shell ---------- */
function render(){
  if(!signedIn()){ $("#app").hidden=true; $("#auth").hidden=false; renderAuth(); return }
  $("#auth").hidden=true; $("#app").hidden=false;
  const navAllowed=NAV.filter(n=>n[2]());
  if(!navAllowed.find(n=>n[0]===view)) view="dashboard";
  $("#nav").innerHTML=navAllowed.map(([k,l])=>{
    const ct=k==="leads"?visibleLeads().length:k==="alerts"?(unreadCount()||""):"";
    return `<button class="${view===k?"on":""}" data-act="go" data-v="${k}">${l}${ct!==""?`<span class="ct">${ct}</span>`:""}</button>`}).join("");
  $("#title").textContent=(NAV.find(n=>n[0]===view)||NAV[0])[1];
  const m=me();
  const rm=realMe(); const ini=(rm?.name||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
  $("#who").innerHTML=`<span class="uchip"><span class="av" aria-hidden="true">${esc(ini)}</span><span><b>${esc(rm?.name||"")}</b><span class="sub" style="display:block">${esc(roleOf(rm)?.name||"")}</span></span></span>`+
    (realIsSuper()?`<select id="previewAs" aria-label="Preview the app as another staff member"><option value="">Preview as…</option>${activeStaff().filter(s=>s.id!==rm.id).map(s=>`<option value="${s.id}" ${previewId===s.id?"selected":""}>${esc(s.name)} · ${esc(roleOf(s)?.name||"")}</option>`).join("")}</select>`:"")+
    `<button class="btn sm" data-act="myPassword">Password</button><button class="btn sm" data-act="signOut">Sign out</button>`;
  const uc=unreadCount(); const b=$("#bell"); b.hidden=!uc; b.textContent=uc;
  $("#railfoot").textContent=ORG?`${ORG.name} · ${ORG.effective.name}`:"";
  const ae=document.activeElement, aid=ae&&ae.id&&$("#view").contains(ae)?ae.id:null, sel=aid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  const V={dashboard:vDashboard,leads:vLeads,customers:vCustomers,staff:vStaff,roles:vRoles,masters:vMasters,templates:vTemplates,alerts:vAlerts,billing:vBilling,platform:vPlatform}[view]||vDashboard;
  const pv=previewId&&realIsSuper()&&me()!==rm?`<div class="banner"><span>Previewing as <b>${esc(me().name)}</b> (${esc(roleOf(me())?.name||"")}). You see exactly what they see.</span><span style="flex:1"></span><button class="btn sm" data-act="endPreview">Back to my view</button></div>`:"";
  $("#view").innerHTML=pv+V();
  if(aid){const el=document.getElementById(aid); if(el){el.focus(); if(sel&&el.setSelectionRange) try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  if(modal.refresh) modal.refresh();
}
const activeStaff=()=>S.staff.filter(s=>s.active!==false&&!s.pending&&!s.rejected);
const pill=l=>{const s=byId("statuses",l.statusId);return `<span class="pill c-${s?.cat||"new"}">${esc(s?.name||"New")}</span>`};
const empty=(t,s)=>`<div class="empty"><b>${t}</b>${s||""}</div>`;

/* ---------- DASHBOARD ---------- */
function kpiSets(leads){const td=todayStr();return{
  total:leads, new:leads.filter(l=>catOf(l)==="new"), today:leads.filter(l=>dayOf(l.createdAt)===td),
  followup:leads.filter(l=>!closed(l)&&(catOf(l)==="followup"||fuMs(l))), converted:leads.filter(l=>catOf(l)==="converted"), dead:leads.filter(l=>catOf(l)==="dead")}}
function vDashboard(){
  if(!S.staff.length&&!S.roles.length) return setupEmpty();
  if(!can("dashboard")) return `<div class="panel">${empty("Dashboard is turned off for your role","Ask an Admin to enable Dashboard access in Roles & Rules.")}</div>`+notifPanel();
  const L=visibleLeads(), K=kpiSets(L), now=Date.now();
  const overdue=K.followup.filter(l=>fuMs(l)&&fuMs(l)<now).length;
  const card=(k,cls,label,sub)=>`<button class="kpi ${cls}" data-act="kpi" data-v="${k}"><span class="l">${label}</span><span class="v">${K[k].length}</span><span class="s">${sub}</span></button>`;
  const sample=COLS.some(c=>S[c].some(x=>x.sample));
  let h="";
  h+=planBanner();
  if(sample&&isSuper()) h+=`<div class="banner"><span><b>Sample records are loaded</b> so you can try every screen. Clear them before your team starts adding real leads.</span><span style="flex:1"></span><button class="btn sm" data-act="clearSample">Clear sample data</button></div>`;
  h+=`<div class="kpis">${card("total","","Total leads",`${S.leads.length===L.length?"All in system":"In your view"}`)}${card("new","k-new","New leads","Not yet actioned")}${card("today","","Today's leads",new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short"}))}${card("followup","k-fu","Follow-up",overdue?`${overdue} overdue`:"None overdue")}${card("converted","k-won","Converted",L.length?Math.round(K.converted.length/L.length*100)+"% of total":"—")}${card("dead","k-dead","Dead leads",L.length?Math.round(K.dead.length/L.length*100)+"% of total":"—")}</div>`;
  // source breakdown
  const srcCount={}; L.forEach(l=>{srcCount[l.sourceId]=(srcCount[l.sourceId]||0)+1});
  const rows=Object.entries(srcCount).sort((a,b)=>b[1]-a[1]); const mx=Math.max(1,...rows.map(r=>r[1]));
  const src=rows.length?`<div class="bars">${rows.map(([id,n])=>`<div class="brow"><span title="${esc(nm("sources",id))}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nm("sources",id)||"Unknown")}</span><div class="track"><div class="fill" style="width:${n/mx*100}%"></div></div><span class="mono" style="text-align:right">${n}</span></div>`).join("")}</div>`:empty("No leads yet","Source counts appear once leads come in.");
  h+=`<div class="grid2"><div class="panel"><h2>Source of leads</h2><div class="pb">${src}</div></div>${notifPanel(6)}</div>`;
  // role views
  const lvl=roleOf(me())?.level, sc=scopeOf();
  if(sc==="hierarchy") h+=`<div class="panel"><h2>My hierarchy</h2><div class="pb">${hierarchy(me().id)}</div></div>`;
  if(sc==="team") h+=staffTable([me().id,...directs(me().id)],"My team report");
  if(sc==="all") h+=staffTable(activeStaff().map(s=>s.id),"Staff-wise leads");
  if(["own","routed","converted"].includes(sc)) h+=myQueue();
  return h;
}
function setupEmpty(){return `<div class="panel">${empty("Your LMS is empty","Start by adding roles and your first staff member. Go to Roles & Rules, then Staff.")}<div class="pb" style="display:flex;gap:8px;justify-content:center"><button class="btn pri" data-act="go" data-v="roles">Set up roles</button><button class="btn" data-act="go" data-v="staff">Add staff</button></div></div>`}
function statsFor(ids){const L=S.leads.filter(l=>ids.includes(l.assignedTo));return{t:L.length,o:L.filter(l=>!closed(l)&&catOf(l)!=="followup").length,f:L.filter(l=>catOf(l)==="followup").length,c:L.filter(l=>catOf(l)==="converted").length,d:L.filter(l=>catOf(l)==="dead").length}}
function staffTable(ids,title){
  const rows=ids.map(id=>byId("staff",id)).filter(Boolean).map(s=>{const st=statsFor([s.id]);return{s,st}}).sort((a,b)=>b.st.t-a.st.t);
  return `<div class="panel"><h2>${title}</h2><div class="tw"><table><thead><tr><th>Staff</th><th>Role</th><th class="num">Total</th><th class="num">Open</th><th class="num">Follow-up</th><th class="num">Converted</th><th class="num">Dead</th><th class="num">Conversion</th></tr></thead><tbody>${
    rows.map(({s,st})=>`<tr class="click" data-act="staffLeads" data-id="${s.id}"><td><b>${esc(s.name)}</b> ${onShift(s)?"":`<span class="tag">Off shift</span>`}</td><td>${esc(roleOf(s)?.name||"")}</td><td class="num">${st.t}</td><td class="num">${st.o}</td><td class="num">${st.f}</td><td class="num">${st.c}</td><td class="num">${st.d}</td><td class="num">${st.t?Math.round(st.c/st.t*100)+"%":"—"}</td></tr>`).join("")||`<tr><td colspan="8">${empty("No staff in this view")}</td></tr>`}</tbody></table></div></div>`}
function hierarchy(rootId){
  const node=id=>{const s=byId("staff",id); if(!s) return ""; const st=statsFor([id,...descendants(id)]); const kids=directs(id);
    return `<li><div class="tnode"><b>${esc(s.name)}</b><span class="tag">${esc(roleOf(s)?.name||"")}</span><span class="sub">${st.t} leads · ${st.f} follow-up · ${st.c} converted</span>${s.active===false?`<span class="pill c-off">Deactivated</span>`:""}</div>${kids.length?`<ul class="tree">${kids.map(node).join("")}</ul>`:""}</li>`};
  return `<ul class="tree root">${node(rootId)}</ul>`}
function myQueue(){
  const L=visibleLeads().filter(l=>!closed(l)).sort((a,b)=>(fuMs(a)||9e15)-(fuMs(b)||9e15)).slice(0,10);
  return `<div class="panel"><h2>My open leads</h2><div class="tw"><table><thead><tr><th>Lead</th><th>Product</th><th>Status</th><th>Follow-up</th></tr></thead><tbody>${L.map(l=>`<tr class="click" data-act="lead" data-id="${l.id}"><td><b>${esc(l.name)}</b><div class="sub">${esc(l.mobile)}</div></td><td>${esc(nm("products",l.productId))}</td><td>${pill(l)}</td><td>${l.followUpAt?fmt(fuMs(l)):"—"}</td></tr>`).join("")||`<tr><td colspan="4">${empty("Nothing open right now")}</td></tr>`}</tbody></table></div></div>`}
function notifPanel(limit){
  const m=me(); const rem=myReminders().map(l=>({k:"reminder",t:`Follow up: ${l.name}`,s:`${fuMs(l)<Date.now()?"Overdue · ":""}${fmt(fuMs(l))} · ${nm("products",l.productId)}`,act:`data-act="lead" data-id="${l.id}"`,unread:true,at:fuMs(l)}));
  const al=myAlerts().map(a=>({k:a.type,t:a.title,s:`${a.msg?a.msg+" · ":""}${nm("staff",a.from)?"From "+nm("staff",a.from)+" · ":""}${fmt(a.at)}`,act:a.leadId?`data-act="alertOpen" data-id="${a.id}"`:`data-act="alertRead" data-id="${a.id}"`,unread:!(a.readBy||[]).includes(m?.id)}));
  let all=[...rem,...al]; const total=all.length; if(limit) all=all.slice(0,limit);
  const label={newlead:"New lead",reminder:"Reminder",admin:"Admin",manager:"Manager",tl:"TL"};
  return `<div class="panel"><div class="ph">Notifications<span class="sp"></span>${total>(limit||1e9)?`<button class="btn sm" data-act="go" data-v="alerts">View all ${total}</button>`:""}</div><div class="notes">${all.map(n=>`<div class="note ${n.unread?"unread":""}" role="button" tabindex="0" ${n.act} style="cursor:pointer"><span class="k k-${n.k}">${label[n.k]||n.k}</span><div style="min-width:0"><div class="t">${esc(n.t)}</div><div class="sub">${esc(n.s)}</div></div></div>`).join("")||empty("You're all caught up","New leads, follow-up reminders and team alerts show here.")}</div></div>`}

/* ---------- LEADS ---------- */
function filteredLeads(){
  let L=visibleLeads(); const q=ui.leadQ.trim().toLowerCase();
  if(q) L=L.filter(l=>[l.name,l.mobile,l.company,l.email,l.code].some(v=>String(v||"").toLowerCase().includes(q)));
  if(ui.fStatus) L=L.filter(l=>l.statusId===ui.fStatus); if(ui.fSource) L=L.filter(l=>l.sourceId===ui.fSource);
  if(ui.fProduct) L=L.filter(l=>l.productId===ui.fProduct); if(ui.fStaff) L=L.filter(l=>(ui.fStaff==="_none"?!l.assignedTo:l.assignedTo===ui.fStaff));
  if(ui.fKpi&&ui.fKpi!=="total") L=kpiSets(L)[ui.fKpi]||L;
  return L.sort((a,b)=>b.createdAt-a.createdAt)}
/* latest remark = newest remark, status update or message sent on the lead */
function latestRemark(l){const h=(l.history||[]).find(x=>["remark","update","send"].includes(x.kind)); return h||null}
function remarkCell(l){const h=latestRemark(l); if(!h) return `<span class="sub">No remarks yet</span>`;
  return `<div class="t" title="${esc(h.text)}">${esc(h.text)}</div><div class="m">${esc(nm("staff",h.by)||"System")} · ${fmt(h.at)}</div>`}
const opts=(arr,val,blank)=>(blank!=null?`<option value="">${blank}</option>`:"")+arr.map(x=>`<option value="${x.id}" ${x.id===val?"selected":""}>${esc(x.name)}</option>`).join("");
function vLeads(){
  const L=filteredLeads(); const staffIn=reach().map(id=>byId("staff",id)).filter(Boolean);
  const kl={"":"All","total":"All",new:"New",today:"Today",followup:"Follow-up",converted:"Converted",dead:"Dead"};
  return `<div class="bar"><input type="search" id="leadQ" placeholder="Search leads" value="${esc(ui.leadQ)}" data-ui="leadQ" aria-label="Search leads">
  <select id="fKpi" data-ui="fKpi" aria-label="Lead stage">${Object.entries(kl).filter(([k])=>k!=="total").map(([k,v])=>`<option value="${k}" ${ui.fKpi===k?"selected":""}>${k?v:"All stages"}</option>`).join("")}</select>
  <select id="fStatus" data-ui="fStatus" aria-label="Status">${opts(S.statuses,ui.fStatus,"All statuses")}</select>
  <select id="fSource" data-ui="fSource" aria-label="Source">${opts(S.sources,ui.fSource,"All sources")}</select>
  <select id="fProduct" data-ui="fProduct" aria-label="Product">${opts(S.products,ui.fProduct,"All products")}</select>
  <select id="fStaff" data-ui="fStaff" aria-label="Assigned to"><option value="">All staff</option><option value="_none" ${ui.fStaff==="_none"?"selected":""}>Unassigned</option>${staffIn.map(s=>`<option value="${s.id}" ${ui.fStaff===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select>
  <span style="flex:1"></span>${can("uploadLeads")?`<button class="btn" data-act="uploadLeads">Upload sheet</button>`:""}${can("createLead")?`<button class="btn pri" data-act="leadForm">New lead</button>`:""}</div>
  <div class="panel"><div class="tw"><table><thead><tr><th>Lead ID</th><th>Latest remark</th><th>Name</th><th>Mobile</th><th>Product</th><th>Source</th><th>Status</th><th>Assigned to</th><th>Follow-up</th><th>Created</th></tr></thead><tbody>${

function sendModal(leadId,type,ch,custId){
  const l=leadId?byId("leads",leadId):null; const c=custId?byId("customers",custId):byId("customers",l?.customerId);
  const ctx=l||{name:c?.name,mobile:c?.mobile,email:c?.email,company:c?.company};
  const pid=l?.productId; const m=me();
  const pick=S.templates.filter(t=>t.channel===ch&&(!type||t.type===type)&&(!t.productId||!pid||t.productId===pid));
  const all=S.templates.filter(t=>t.channel===ch&&(!t.productId||!pid||t.productId===pid));
  const list=pick.length?pick:all;
  const fill=s=>String(s||"").replace(/\{(\w+)\}/g,(_,k)=>({name:ctx.name,company:ctx.company||ctx.name,product:nm("products",pid),mobile:ctx.mobile,email:ctx.email,lead_id:l?.code||"",customer_id:c?.code||"",staff:m?.name||"",staff_mobile:m?.mobile||""}[k]??""));
  const to=ch==="email"?ctx.email:ctx.mobile;
  openModal(`${type?`Send ${type.toLowerCase()}`:"Send message"} · ${CHANNELS[ch]}`,`
   <div class="bar"><span class="lbl">Channel</span>${Object.entries(CHANNELS).map(([k,v])=>`<button class="btn sm ${k===ch?"pri":""}" data-act="send" data-lead="${leadId||""}" data-cust="${custId||""}" data-type="${type}" data-ch="${k}">${v}</button>`).join("")}</div>
   <div class="f"><label for="sm-to">To</label><input id="sm-to" value="${esc(to||"")}" placeholder="${ch==="email"?"No email on file":"No mobile on file"}"></div>
   <div class="f"><label for="sm-t">Template</label><select id="sm-t">${list.map(t=>`<option value="${t.id}">${esc(t.name)} · ${esc(t.type)}${t.productId?" · "+esc(nm("products",t.productId)):""}</option>`).join("")||`<option value="">No ${CHANNELS[ch]} templates yet</option>`}</select>${list.length?"":`<span class="hint">Create one under Templates.</span>`}</div>
   <div class="f" id="sm-subj-w"><label for="sm-subj">Subject</label><input id="sm-subj"></div>
   <div class="f"><label for="sm-body">Message</label><textarea id="sm-body" style="min-height:180px"></textarea></div>
   <p class="hint">Marking as sent logs it on the lead. Direct delivery through your email, SMS and WhatsApp providers is connected during integration; until then copy the message or open it in your app.</p>`,
   `<button class="btn" data-act="close">Cancel</button><a class="btn" id="sm-open" target="_blank" rel="noopener">Open in ${CHANNELS[ch]}</a><button class="btn" id="sm-copy">Copy message</button><button class="btn pri" id="sm-send">Mark as sent</button>`);
  const apply=()=>{const t=byId("templates",$("#sm-t").value); $("#sm-subj").value=fill(t?.subject); $("#sm-body").value=fill(t?.body)||(ch==="email"?"":`Hi ${ctx.name||""},`); $("#sm-subj-w").hidden=ch!=="email"; link()};
  const link=()=>{const b=$("#sm-body").value, s=$("#sm-subj").value, num=($("#sm-to").value||"").replace(/\D/g,""), a=$("#sm-open");
    a.href=ch==="email"?`mailto:${encodeURIComponent($("#sm-to").value)}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(b)}`:ch==="whatsapp"?`https://wa.me/${num.length===10?"91"+num:num}?text=${encodeURIComponent(b)}`:`sms:${num}?body=${encodeURIComponent(b)}`};
  $("#sm-t").addEventListener("change",apply); ["sm-body","sm-subj","sm-to"].forEach(i=>$("#"+i).addEventListener("input",link)); apply();
  $("#sm-copy").addEventListener("click",()=>{const txt=(ch==="email"?$("#sm-subj").value+"\n\n":"")+$("#sm-body").value;
    navigator.clipboard?.writeText(txt).then(()=>toast("Message copied"),()=>{$("#sm-body").select();toast("Press Ctrl+C to copy")})||($("#sm-body").select(),toast("Press Ctrl+C to copy"))});
  $("#sm-send").addEventListener("click",async()=>{const target=l||(c&&S.leads.filter(x=>x.customerId===c.id).sort((a,b)=>b.createdAt-a.createdAt)[0]);
    const tn=byId("templates",$("#sm-t").value)?.name;
    if(target){const ok=await act("POST",`/api/leads/${target.id}/log`,{text:`${type||"Message"} sent by ${CHANNELS[ch]} to ${$("#sm-to").value||"—"}${tn?` (template: ${tn})`:""}`}); if(!ok) return}
    closeModal(); toast(`${type||"Message"} logged as sent`); if(l) leadDetail(l.id)});
}

const hnorm=v=>String(v??"").trim().toLowerCase().replace(/[_.]+/g," ").replace(/\s+/g," ");
function parseCSV(text){const rows=[];let row=[],cell="",q=false;text=text.replace(/^﻿/,"");
  const delim=(text.split("\n")[0].match(/;/g)||[]).length>(text.split("\n")[0].match(/,/g)||[]).length?";":",";
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true; else if(c===delim){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++; row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=c}
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()!==""))}
async function readSheet(file){
  if(/\.csv$|\.txt$/i.test(file.name)) return parseCSV(await file.text());
  if(!/\.xlsx?$/i.test(file.name)) throw new Error("Upload a .csv, .xlsx or .xls file.");
  try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js")}catch(e){throw new Error("Couldn't load the Excel reader. Save the sheet as CSV and upload that instead.")}
  const wb=window.XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return window.XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:"yyyy-mm-dd hh:mm",defval:""}).filter(r=>r.some(c=>String(c).trim()!==""))}
function autoMap(headers){const map={},used=new Set();
  UP_FIELDS.forEach(([k,,,syn])=>{const i=headers.findIndex((h,ix)=>!used.has(ix)&&syn.includes(hnorm(h))); if(i>=0){map[k]=i;used.add(i)}});
  UP_FIELDS.forEach(([k,,,syn])=>{if(map[k]!=null) return; const i=headers.findIndex((h,ix)=>!used.has(ix)&&syn.some(x=>hnorm(h).includes(x))); if(i>=0){map[k]=i;used.add(i)}});
  return map}

async function subscribe(plan){let d; try{d=await api("POST","/api/billing/subscribe",{plan})}catch(e){return}

  const rz=new window.Razorpay({key:d.keyId,subscription_id:d.subscriptionId,name:"HAE LMS",description:`${(ORG.plans.find(p=>p.id===plan)||{}).name} plan for ${d.name}`,
    prefill:{name:realMe()?.name||"",email:d.email||"",contact:d.contact||""},theme:{color:"#7a3ff0"},
    handler:async r=>{const ok=await act("POST","/api/billing/verify",{...r,plan}); if(ok) toast("Payment received. Your plan is active.")},
    modal:{ondismiss:()=>toast("Payment cancelled")}});
  rz.on("payment.failed",r=>toast(r.error?.description||"Payment failed")); rz.open()}

  if(!demoAccounts.length) return "";
  return `<section class="demo" aria-label="Demo logins"><h2>Demo logins · tap to sign in</h2><div class="dgrid">${demoAccounts.map((x,i)=>`<button type="button" class="dcred" data-act="demoLogin" data-i="${i}"><b>${esc(x.role)}</b><span>${esc(x.email)}</span><span>${esc(x.password)}</span></button>`).join("")}</div><p class="small" style="margin:0">Each card fills the email and password, then logs in. Remove these with Clear sample data before your team goes live.</p></section>`}
function paintMsg(){const b=$("#amsg"); if(!b) return; b.innerHTML=authMsg?`<div class="amsg ${authMsg.t}" role="alert">${esc(authMsg.m)}</div>`:""}
function aMsg(t,m){authMsg={t,m};paintMsg()}
async function post(url,body){const r=await fetch(url,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); let d={}; try{d=await r.json()}catch(e){} return {ok:r.ok,d}}

async function doLogin(f){const email=f.email.value.trim().toLowerCase(), pw=f.password.value;
  if(!emailOk(email)||!pw) return aMsg("err","Enter your email and password.");
  const {ok,d}=await post("/api/auth/login",{email,password:pw,remember:f.remember.checked});
  if(!ok) return aMsg(/approval/.test(d.error||"")?"info":"err",d.error||"Couldn't log in. Try again.");
  authMsg=null; view="dashboard"; await refresh(); toast(`Welcome, ${(d.name||"").split(" ")[0]}`)}
async function doSignup(f){const name=f.name.value.trim(), mobile=f.mobile.value.trim(), email=f.email.value.trim().toLowerCase(), pw=f.password.value;
  if(name.length<2) return aMsg("err","Enter your full name.");
  if(mobile.replace(/\D/g,"").length<10) return aMsg("err","Enter a valid mobile number with at least 10 digits.");
  if(!emailOk(email)) return aMsg("err","Enter a valid email address.");
  if(!pwValid(pw)) return aMsg("err","Use at least 8 characters, including a letter and a number.");
  if(pw!==f.confirm.value) return aMsg("err","The two passwords don't match.");
  const extra=signupMode==="company"?{mode:"company",company:(f.company?.value||"").trim()}:{mode:"join",code:(f.code?.value||"").trim().toUpperCase()};
  if(extra.mode==="company"&&extra.company.length<2) return aMsg("err","Enter your company name.");
  if(extra.mode==="join"&&!extra.code) return aMsg("err","Enter your company code.");
  const {ok,d}=await post("/api/auth/signup",{name,mobile,email,password:pw,...extra});
  if(!ok) return aMsg("err",d.error||"Couldn't create your account. Try again.");
  if(d.status==="pending"){authMode="pending";authMsg=null;return renderAuth(true)}
  if(d.code){authMsg=null; await refresh(); go("billing"); toast(`${d.company} is ready. Your company code is ${d.code}`); return}
  if(d.status==="inactive"){authMode="login";authMsg={t:"info",m:"Password set, but your account is deactivated. Contact your Admin."};return renderAuth(true)}
  authMsg=null; await refresh(); toast(`Welcome, ${(d.name||name).split(" ")[0]}`)}

document.addEventListener("submit",async e=>{const id=e.target.id; if(!["lg","sg"].includes(id)) return; e.preventDefault(); if(authBusy) return;
  authBusy=true; e.target.querySelectorAll("button[type=submit]").forEach(b=>b.disabled=true);
  try{await ({lg:doLogin,sg:doSignup})[id](e.target)}catch(err){aMsg("err","Can't reach the server. Check your connection and try again.")}
  authBusy=false; document.querySelectorAll("#auth button[type=submit]").forEach(b=>b.disabled=false)});
document.addEventListener("input",e=>{if(e.target.id!=="sg-p") return; const sc=pwScore(e.target.value), bar=$("#sg-mt");
  if(bar){bar.style.width=(sc/5*100)+"%"; bar.style.background=sc<2?"var(--dead)":sc<4?"var(--follow)":"var(--won)"}});

function approveForm(id){const s=byId("staff",id);
  openModal(`Approve ${s.name}`,`<form class="form" id="apf"><p class="full sub" style="margin:0">${esc(s.email)} · ${esc(s.mobile)}</p>
   <div class="f"><label for="ap-r">Role *</label><select id="ap-r" name="roleId" required>${opts(S.roles.filter(r=>r.level!=="superadmin"||realIsSuper()),"","Choose a role")}</select></div>
   <div class="f"><label for="ap-t">Reports to</label><select id="ap-t" name="reportsTo">${opts(activeStaff(),"","No one")}</select></div>
   <div class="f full"><span class="lbl">Assigned products</span><div class="checks">${S.products.map(p=>`<label><input type="checkbox" name="products" value="${p.id}"> ${esc(p.name)}</label>`).join("")||"<span class='hint'>No products yet</span>"}</div></div></form>`,
   `<button class="btn" data-act="close">Cancel</button><button class="btn pri" type="submit" form="apf">Approve and activate</button>`);
  $("#apf").addEventListener("submit",async e=>{e.preventDefault(); const fd=new FormData(e.target); if(!fd.get("roleId")){toast("Choose a role");return}
    if(await act("POST",`/api/staff/${id}/approve`,{roleId:fd.get("roleId"),reportsTo:fd.get("reportsTo"),products:fd.getAll("products")})){closeModal(); toast(`${s.name} can now log in`)}})}

/* ---------- boot ---------- */
const _render=render;
render=function(){_render(); if(view==="alerts"&&signedIn()) bindAlertForm()};
async function loadDemo(){try{const r=await fetch("/api/auth/demo-accounts"); demoAccounts=r.ok?await r.json():[]}catch(e){demoAccounts=[]} if(!signedIn()) renderAuth(true)}
let es=null;
function listen(){if(es||!window.EventSource) return; es=new EventSource("/api/events");
  es.addEventListener("change",()=>{if(!signedIn()) return; clearTimeout(listen._t); listen._t=setTimeout(()=>refresh().catch(()=>{}),250)});
  es.onerror=()=>{if(!signedIn()){es.close();es=null}}}
const _refresh=refresh;
refresh=async function(){await _refresh(); listen()};
(async function boot(){
  render();
  await loadDemo();
  try{await refresh()}catch(e){} authReady=true; render();
  setInterval(()=>{if(signedIn()&&!$("#modal").innerHTML&&document.activeElement?.tagName!=="INPUT") render()},60000);
})();
</script>
</body>
